<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | The Computation Society</title>
    <link rel="stylesheet" href="static/style.css">
    <script async src="https://tally.so/widgets/embed.js"></script>

<body>

    <header class="site-header">
        <a class="brand" href="index.html">The Computation Society</a>
        <nav class="site-nav" aria-label="Main">
            <a class="btn btn-ghost" href="index.html">Home</a>
            <a class="btn btn-ghost is-current" href="events.html">Events</a>
        </nav>
    </header>

    <main>
        <section class="hero hero-compact">
            <p class="eyebrow">Calendar</p>
            <h1>Events</h1>
            <div class="ruler" aria-hidden="true"></div>

        <section class="section">
            <p class="section-label">&sect; 1 &mdash; Upcoming</p>
            <div class="event-list">
                <article class="event">
                    <time class="event-date" datetime="2026-11-05">Thursday, November 5, 2026 &middot; 1:00 PM &middot; TBD</time>
                    <h2 class="event-title">Fall Kickoff Meeting</h2>
                    <p class="event-description">Meet the officers, hear what we have planned for the semester, and pitch project ideas.</p>
                </article>
            </div>
        </section>

        <section class="section">
            <p class="section-label">&sect; 2 &mdash; Past</p>
            <div class="event-list event-list-past">
                <p class="empty">No past events.</p>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <span>&copy; 2026 The Computation Society</span>
        <span aria-hidden="true">&#8718;</span>
